opencode = { version = "2.4.1", allow_builds = ["@opencode/cli"] }
pi = "1.6.0"
ruff = "0.17.6"
stripe-cli = "1.55.15"
trdsql = "1.2.3"
uv = "0.13.10"
yay = "13.1.0"
youtube-dl = "2026.11.06"
zls = "0.17.0"
"npm:@agentclientprotocol/codex-acp" = "2.12.0"
agy = "1.5.16"
