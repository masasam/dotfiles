"github:github/copilot-language-server-release" = { version = "1.574.2", asset_pattern = "copilot-language-server-{{ os(macos='darwin', windows='win32') }}-{{ arch(x64='x64', arm64='arm64') }}-*.zip", filter_bins = "copilot-language-server" }
"npm:@googleworkspace/cli" = "0.22.5"
