[env]
_.file = { path = "~/.config/mise/secrets.toml", redact = true }

[tools]
atlas = "1.3.0"
aws-cli = { version = "2.40.3", symlink_bins = "true" }
bun = "1.4.4"
cf = "8.19.0"
claude-code = "2.1.325"
codex = "0.169.0"
deno = "2.9.8"
duckdb = "2.0.0"
erlang = "29.1.2"
elixir = "1.20.5-otp-29"
elixir-ls = { version = "0.31.1", symlink_bins = "true" }
firebase = "15.36.0"
gcloud = "593.0.0"
gemini-cli = { version = "0.68.0", allow_builds = ["@github/keytar", "node-pty"] }
herdr = "0.9.5"
hugo = "0.170.0"
kind = "0.33.0"
lua-language-server = "3.19.2"
marp-cli = "4.5.1"
node = "26.13.1"
"npm:@github/copilot" = "1.0.112"
# Use official native releases, avoiding npm's unrelated cross-platform SDK dependencies.
"github:github/copilot-language-server-release" = { version = "1.570.0", asset_pattern = "copilot-language-server-{{ os(macos='darwin', windows='win32') }}-{{ arch(x64='x64', arm64='arm64') }}-*.zip", filter_bins = "copilot-language-server" }
"npm:@googleworkspace/cli" = "0.22.5"
"npm:oxlint" = "1.93.0"
"npm:playwright" = "1.65.1"
"npm:pnpm" = "12.21.0"
"npm:ts-node" = "10.9.2"
"npm:typescript" = "7.0.2"
opencode = { version = "2.3.0", allow_builds = ["@opencode/cli"] }
pi = "1.5.2"
ruff = "0.17.5"
stripe-cli = "1.55.11"
trdsql = "1.2.3"
uv = "0.13.8"
yay = "13.1.0"
youtube-dl = "2026.11.06"
zls = "0.17.0"
"npm:@agentclientprotocol/codex-acp" = "2.6.0"
